name: CI

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

# Least privilege: CI only reads the repository. It uses no secrets.
permissions:
  contents: read

# One run per PR (or branch): a new push cancels the outdated PR run.
# Pushes to main/dev are never cancelled, so every merged commit gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Nothing pushes back: keep the token out of .git/config so that
          # dependency install scripts cannot read it.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Node 26 is the current LTS line and matches local development
          # (v26.x) and @types/node ^26. It also satisfies the strictest
          # engines in the tree: vitest 5 and jsdom 30.
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:run

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build
        env:
          # CI builds are never deployed: use the .env.example values,
          # never the production API.
          VITE_API_BASE_URL: http://localhost:3000
          VITE_API_TIMEOUT_MS: '10000'
