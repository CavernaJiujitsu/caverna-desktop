name: Azure Static Web Apps CI/CD

# Production deploy only. PR checks live in ci.yml and never reach Azure, so
# no PR preview environment is built against the production API.
on:
  push:
    branches:
      - main

# Deploys must not race: queue them in push order and never cancel an upload
# that is already running.
concurrency:
  group: azure-static-web-apps-production
  cancel-in-progress: false

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: false
          # Nothing pushes back: the deploy uses the SWA token and OIDC, so
          # keep the repository credentials away from install scripts.
          persist-credentials: false
      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client
      - name: Get Id Token
        uses: actions/github-script@v9
        id: idtoken
        with:
          script: |
            const coredemo = require('@actions/core')
            return await coredemo.getIDToken()
          result-encoding: string
      - name: Build And Deploy
        id: builddeploy
        env:
          VITE_API_BASE_URL: https://caverna-jiujitsu-api.chickenkiller.com
          VITE_API_TIMEOUT_MS: '10000'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_HAPPY_GLACIER_0A3215610 }}
          action: 'upload'
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: '/' # App source code path
          api_location: '' # Api source code path - optional
          output_location: 'dist' # Built app content directory - optional
          github_id_token: ${{ steps.idtoken.outputs.result }}
          ###### End of Repository/Build Configurations ######
